# Masaar CRM — nginx reverse proxy with TLS
# Place TLS certificate at /etc/ssl/masaar/fullchain.pem and privkey.pem
# (or use Certbot: certbot --nginx -d crm.yourcompany.ae)
#
# Usage: copy to /etc/nginx/sites-available/masaar and symlink to sites-enabled

server {
    listen 80;
    server_name crm.yourcompany.ae;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name crm.yourcompany.ae;

    ssl_certificate     /etc/ssl/masaar/fullchain.pem;
    ssl_certificate_key /etc/ssl/masaar/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers (Fiber's helmet middleware adds most, nginx adds HSTS)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ── Frontend (Next.js on port 3000) ──────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── API (Go Fiber on port 8080) ───────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 10m;
    }

    # ── Public webhook endpoint ───────────────────────────────────────────────
    location /webhooks/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        client_max_body_size 1m;
    }

    # ── WebSocket notifications ───────────────────────────────────────────────
    location /ws/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;  # keep WS alive for 1h
    }

    # ── Swagger docs (restrict to internal network in production) ─────────────
    location /docs {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
        proxy_pass http://127.0.0.1:8080;
    }

    # Block common attack paths
    location ~ /\. { deny all; }
}
