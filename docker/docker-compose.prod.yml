version: "3.9"

# Production overrides — use with:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d
#
# Required env vars (set in .env or your secrets manager):
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#   REDIS_PASSWORD
#   JWT_SECRET                   (min 32 random chars)
#   WA_VERIFY_TOKEN, WA_APP_SECRET, WA_ACCESS_TOKEN, WA_PHONE_NUMBER_ID
#   ALLOWED_ORIGINS              (e.g. https://crm.yourcompany.ae)
#   PUBLIC_API_URL               (e.g. https://api.yourcompany.ae)
#   APP_URL                      (e.g. https://crm.yourcompany.ae)

services:
  postgres:
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups          # mount for pg_dump cron backups
    ports: []                       # don't expose DB port in production
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --loglevel warning
    ports: []                       # don't expose Redis port in production
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ollama:
    restart: always
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 10 && ollama pull ${OLLAMA_MODEL:-llama3} && wait"]
    ports: []                       # don't expose Ollama externally
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 6G

  api:
    restart: always
    environment:
      APP_ENV: production
      APP_URL: ${APP_URL}                         # e.g. https://crm.yourcompany.ae
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=require
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      WA_VERIFY_TOKEN: ${WA_VERIFY_TOKEN}
      WA_APP_SECRET: ${WA_APP_SECRET}             # REQUIRED — validates Meta webhook signatures
      WA_ACCESS_TOKEN: ${WA_ACCESS_TOKEN}
      WA_PHONE_NUMBER_ID: ${WA_PHONE_NUMBER_ID}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}         # e.g. https://crm.yourcompany.ae
      MAGIC_LINK_BASE_URL: ${APP_URL}
    ports: []                       # put behind a reverse proxy (nginx/caddy)
    networks:
      - internal
      - proxy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  web:
    restart: always
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}      # e.g. https://api.yourcompany.ae
      NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL}        # e.g. wss://api.yourcompany.ae
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
    ports: []                       # put behind a reverse proxy
    networks:
      - proxy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:                         # DB, Redis, Ollama, API — no external access
    driver: bridge
    internal: true
  proxy:                            # API and Web — reachable from reverse proxy
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ollama_data:
