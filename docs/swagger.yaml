host: localhost:8080
info:
  contact:
    email: info@dynamicweblab.com
    name: Dynamic Web Lab FZE LLC
    url: https://dynamicweblab.com
  description: Open-source CRM for the UAE market. WhatsApp-first, RTL-native, self-hosted.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://masaar.dynamicweblab.com/terms
  title: Masaar CRM API
  version: "1.0"
paths:
  /.well-known/oauth-authorization-server:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: OAuth 2.0 authorization server metadata (RFC 8414)
      tags:
      - OAuth
  /api/public/feeds/{portal}/listings.xml:
    get:
      description: Published listings as XML (format "masaar-listings/1"). Listings
        whose advertising permit is missing or expired are left out, unless an admin
        overrode the check. Portals that need their own XML schema can map this feed;
        the portals' schemas are not public.
      parameters:
      - description: Portal
        in: path
        name: portal
        required: true
        type: string
      - description: Feed token
        in: query
        name: token
        required: true
        type: string
      produces:
      - text/xml
      responses:
        "200":
          description: OK
      summary: Listing feed for a portal
      tags:
      - Public
  /api/public/sign/{id}:
    get:
      description: Returns the document and signature details for a given signature
        ID. No auth required.
      parameters:
      - description: Signature UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              document:
                $ref: '#/definitions/domain.Document'
              signature:
                $ref: '#/definitions/domain.DocumentSignature'
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Get signature details (public)
      tags:
      - Public
    post:
      description: Marks a signature as signed. No auth required — the signature UUID
        is the access token. A signature can be signed once; DocuSign-managed signatures
        cannot be signed here.
      parameters:
      - description: Signature UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              status:
                type: string
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
        "409":
          description: Conflict
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Sign a document (public)
      tags:
      - Public
  /api/v1/admin/jobs/runs:
    get:
      parameters:
      - description: Max rows (default 100, max 500)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.JobRun'
            type: array
      security:
      - Bearer: []
      summary: Background job runs
      tags:
      - Admin
  /api/v1/analytics/financial:
    get:
      description: Returns revenue, expenses, and profit metrics for a specified date
        range
      parameters:
      - description: Start date (YYYY-MM-DD)
        in: query
        name: startDate
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: endDate
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Financial analytics data
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Server error
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: Get financial analytics
      tags:
      - Analytics
  /api/v1/analytics/maintenance:
    get:
      description: Returns task completion rates, average response time, and priority
        distribution
      produces:
      - application/json
      responses:
        "200":
