        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Contact'
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
