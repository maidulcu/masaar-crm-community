  /contacts/{id}:
    delete:
      description: Permanently deletes a contact. Requires admin role. Deleting also
        removes the contact's leads, deals, offers, viewings and WhatsApp threads,
        so when any exist the request is refused with 409 and the counts unless `?force=true`
        is given. A contact whose deals have invoices can never be deleted.
      parameters:
      - description: Contact UUID
        in: path
        name: id
        required: true
        type: string
