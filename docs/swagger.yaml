  /api/v1/analytics/properties:
    get:
      description: Returns performance metrics for all properties with pagination
      parameters:
      - default: 10
        description: Limit results
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset results
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Properties analytics list
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Server error
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: List property analytics
      tags:
      - Analytics
  /api/v1/analytics/properties/{propertyID}:
    get:
      description: Returns detailed performance metrics for a specific property
      parameters:
      - description: Property ID
        in: path
        name: propertyID
        required: true
