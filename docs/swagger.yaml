      - Bearer: []
      summary: Get tenant overview analytics
      tags:
      - Analytics
  /api/v1/analytics/tenants:
    get:
      description: Returns performance metrics for all tenants with risk scoring and
        payment history
      parameters:
      - default: 10
        description: Limit results
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset results
        in: query
        name: offset
        type: integer
      produces:
      - application/json
