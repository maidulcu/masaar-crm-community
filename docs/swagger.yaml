      summary: Update language preference
      tags:
      - Users
  /users/me/password:
    patch:
      consumes:
      - application/json
      description: Change the authenticated user's password. Requires current password
        for verification.
      parameters:
      - description: Passwords
        in: body
        name: body
        required: true
        schema:
          properties:
            current_password:
              type: string
            new_password:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - Users
  /webhooks/leads:
    post:
      consumes:
      - application/json
      description: |-
        Create a lead from an external source (website, Zapier, etc.)
        Requires API key with scope lead:create in Authorization header.
      parameters:
      - description: Lead data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.PublicLeadRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'Duplicate external_ref: the existing lead'
          schema:
            additionalProperties: true
            type: object
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Submit a lead (public)
      tags:
      - Public
  /webhooks/portals/{portal}:
    post:
      consumes:
      - application/json
      description: 'The portal posts a JSON lead to this URL (token from Settings
        → Portals). Common field names are recognised at any depth: name/full_name/first_name+last_name,
        phone/mobile/phone_number, email, message/comment, reference/listing_reference,
        and lead_id/id for deduplication. A redelivered lead creates nothing new.
        The contact is created or matched by phone, the lead gets the portal as its
        source and goes through lead rotation.'
      parameters:
      - description: property_finder | bayut | dubizzle | portal
        in: path
        name: portal
        required: true
        type: string
      - description: Inbound token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              duplicate:
                type: boolean
            type: object
        "201":
          description: Created
          schema:
            properties:
              lead_id:
                type: string
            type: object
      summary: Receive a lead from a property portal
      tags:
      - Public
securityDefinitions:
  BearerAuth:
    description: 'JWT Bearer token. Format: "Bearer <token>"'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
