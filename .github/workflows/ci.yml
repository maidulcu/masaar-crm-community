name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: masaar
          POSTGRES_PASSWORD: masaar
          POSTGRES_DB: masaar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U masaar -d masaar_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Enables the multi-company isolation tests in internal/repo (skipped when unset).
      TEST_DATABASE_URL: postgres://masaar:masaar@localhost:5432/masaar_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Entry point must be tracked
        # Guards against .gitignore patterns silently excluding cmd/server/.
        run: test -f cmd/server/main.go
      - run: go vet ./...
      - run: go build ./...
      - name: Build server binary
        run: go build -o /dev/null ./cmd/server
      - run: go test ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Dependency audit (fail on critical)
        run: npm audit --omit=dev --audit-level=critical

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
