name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: masaar
          POSTGRES_PASSWORD: masaar
          POSTGRES_DB: masaar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U masaar -d masaar_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Enables the multi-company isolation tests in internal/repo (skipped when unset).
      TEST_DATABASE_URL: postgres://masaar:masaar@localhost:5432/masaar_test?sslmode=disable
      # Enables the shared (cross-replica) rate-limit test (skipped when unset).
      TEST_REDIS_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Entry point must be tracked
        # Guards against .gitignore patterns silently excluding cmd/server/.
        run: test -f cmd/server/main.go
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt -w on:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go build ./...
      - name: Build server binary
        run: go build -o /dev/null ./cmd/server
      - run: go test ./...
      - name: API docs up to date
        # Regenerates docs/ from the handler annotations; fails if the committed files differ.
        run: |
          scripts/openapi.sh
          git diff --exit-code -- docs/ || { echo "Run scripts/openapi.sh and commit docs/"; exit 1; }
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  einvoice:
    name: E-invoice (PINT AE)
    # Validates the golden e-invoices in internal/einvoice/testdata against the UBL 2.1
    # schema and the official Peppol PINT AE rules. The API job's go test keeps those files
    # in step with the generator.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install xmllint
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
      - name: Validate
        run: scripts/pint-ae/validate.sh internal/einvoice/testdata/*.xml

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Dependency audit (fail on critical)
        run: npm audit --omit=dev --audit-level=critical

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
